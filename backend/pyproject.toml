[project]
name = "music-tutor-backend"
version = "0.1.0"
description = "AI Music Tutor - FastAPI backend for vocal analysis"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.104.1",
    "uvicorn==0.24.0",
    "python-multipart==0.0.6",
    "librosa==0.10.0",
    "numpy==1.24.3",
    "scipy==1.11.4",
    "pydantic==2.5.0",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
